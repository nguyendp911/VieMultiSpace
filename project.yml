name: VieMultiSpace
options:
  bundleIdPrefix: vn.vie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  VieMultiSpace:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ViePN Smart+
        NSFaceIDUsageDescription: Dùng Face ID để khóa các không gian đăng nhập cá nhân.
        NSPhotoLibraryUsageDescription: Cho phép ứng dụng chọn ảnh để đăng bài viết lên Facebook trong chức năng Smart Post.
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.vie.multispace
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
